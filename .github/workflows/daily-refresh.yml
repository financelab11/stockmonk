name: Daily market data refresh

on:
  schedule:
    # GitHub cron is UTC and can be delayed, so try a short window around
    # 03:00 America/New_York. The guard runs the first attempt after 03:00
    # local time when today's refresh has not completed, then later attempts
    # act as retries. This also covers EDT/EST without a fixed UTC offset.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: Queue every story for a rewrite
        type: boolean
        default: false
      tickers:
        description: Comma-separated tickers for a manual rewrite
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-market-data-refresh
  cancel-in-progress: false

env:
  FORCE_ALL: ${{ inputs.force_all }}
  TICKERS: ${{ inputs.tickers }}

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether today's refresh already completed
        id: clock
        run: |
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)
          last=$(node -e "try{const f=require('./data/story-freshness.json'); process.stdout.write((f.generatedAt||'').slice(0,10))}catch{process.stdout.write('')}")
          echo "America/New_York date: $today, hour: $hour"
          echo "last freshness manifest date: ${last:-missing}"
          if [ "$last" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's refresh already completed; skipping."
          elif [ "$hour" -ge 3 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Queuing today's refresh."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for the 03:00 US Eastern window."
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh US coverage
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 30))
            done
            return 1
          }
          # SEC statements are versioned and refreshed by the weekly bulk job.
          # The daily run rebuilds prices, consensus and scores from them.
          retry pnpm ingest:fundamentals
          # Enrichment failures keep the previous dated snapshot; the strict
          # freshness audit in the finalize job decides whether they are too old.
          retry pnpm ingest:consensus || echo "::warning::consensus refresh failed; keeping the previous snapshot"
          retry pnpm ingest:segments || echo "::warning::segment refresh failed; keeping the previous snapshot"
          retry pnpm ingest:benchmark || echo "::warning::benchmark refresh failed; keeping the previous snapshot"
          retry pnpm ingest:earnings || echo "::warning::earnings refresh failed; keeping the previous snapshot"
          pnpm build:data
          pnpm build:scores
          pnpm build:kpis
          pnpm build:screener
          pnpm build:portfolios
          pnpm build:portfolio-logos
          pnpm ingest:logos
          pnpm build:runtime
          pnpm build:seo

      - name: Commit refreshed data
        run: |
          git config user.name "stockmonk-data-bot"
          git config user.email "data-bot@stockmonk.app"
          git add data public/data public/logos public/portfolio-logos
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily market data refresh"
            for attempt in 1 2 3; do
              git push && break
              sleep $((attempt * 10))
              git pull --rebase --autostash origin main
            done
          fi

  finalize:
    # Run on a fresh checkout of main so this job sees the data committed by
    # the refresh job. Keeping the work in two jobs avoids the 6-hour per-job
    # runner limit as the daily universe grows.
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect material story events
        run: |
          ARGS=""
          if [ "$FORCE_ALL" = "true" ]; then ARGS="$ARGS --force-all"; fi
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --ticker=$TICKERS"; fi
          pnpm detect:events $ARGS

      - name: Rewrite material stories
        env:
          REWRITE_PROVIDER: ${{ vars.REWRITE_PROVIDER }}
          REWRITE_API_KEY: ${{ secrets.REWRITE_API_KEY }}
          REWRITE_MODEL: ${{ vars.REWRITE_MODEL }}
          REWRITE_API_URL: ${{ vars.REWRITE_API_URL }}
        run: |
          ARGS=""
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --ticker=$TICKERS"; fi
          if [ "$FORCE_ALL" = "true" ]; then ARGS="$ARGS --force-all"; fi
          pnpm stories:rewrite $ARGS

      - name: Rebuild the story freshness manifest
        run: |
          ARGS=""
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --ticker=$TICKERS"; fi
          pnpm detect:events $ARGS

      - name: Check freshness
        run: |
          pnpm audit:freshness --strict
          pnpm audit:stories --strict
          pnpm audit:research
          pnpm audit:numbers

      - name: Validate content and types
        run: |
          pnpm validate:content
          pnpm validate:portfolios
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Sync Supabase
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            pnpm sync:supabase
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            pnpm sync:supabase:direct
          else
            echo "No Supabase credential configured" >&2
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Sync normalized research tables
        run: pnpm sync:v2
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Sync portfolio tables
        run: pnpm sync:portfolios
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Commit refreshed narratives
        run: |
          git add content data public/data public/logos public/portfolio-logos
          if git diff --cached --quiet; then
            echo "No narrative changes to commit."
          else
            git commit -m "chore: refresh research narratives"
            for attempt in 1 2 3; do
              git push && break
              sleep $((attempt * 10))
              git pull --rebase --autostash origin main
            done
          fi

      - name: Verify production data health
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 30 --retry-all-errors \
            https://stockmonk.vercel.app/api/health/data

  report:
    needs: [refresh, finalize]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily data refresh failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled data refresh did not complete.",
              "",
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              `Time: ${new Date().toISOString()}`,
              "",
              "Check the failed step and the freshness manifest before re-running.",
              "",
              "If the failure is a rewrite-pending queue, configure REWRITE_PROVIDER and REWRITE_API_KEY, or rewrite the queued tickers manually.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
