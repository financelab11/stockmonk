name: Daily market data refresh

on:
  schedule:
    # Runs after the US close and the Indian close.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh US coverage
        run: pnpm refresh
        env:
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}

      - name: Refresh India coverage
        run: pnpm ingest:india
        env:
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}

      - name: Refresh benchmark prices
        run: pnpm ingest:benchmark

      - name: Rebuild public data
        run: |
          pnpm build:data
          pnpm build:india
          pnpm build:screener

      - name: Commit refreshed data
        run: |
          git config user.name "stockmonk-data-bot"
          git config user.email "data-bot@stockmonk.app"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily market data refresh"
            git push
          fi
