name: Daily market data refresh

on:
  schedule:
    # Runs after the US close and the Indian close.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh US coverage
        run: pnpm refresh
        env:
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}

      - name: Refresh US prices from Yahoo
        run: pnpm refresh:prices

      - name: Ingest earnings releases
        run: pnpm ingest:earnings

      - name: Refresh report prose
        run: pnpm refresh:stories

      - name: Ingest broker notes
        run: pnpm ingest:brokers
        env:
          BROKER_LIMIT: "400"
          BROKER_WORKERS: "3"
          BROKER_DELAY_MS: "150"

      - name: Refresh India coverage
        run: pnpm ingest:india
        env:
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}

      - name: Refresh GCC coverage
        run: pnpm ingest:gcc
        env:
          GCC_DELAY_MS: "750"

      - name: Refresh benchmark prices
        run: pnpm ingest:benchmark

      - name: Rebuild public data
        run: |
          pnpm build:data
          pnpm build:india
          pnpm build:gcc
          pnpm build:screener

      - name: Check freshness
        run: |
          pnpm audit:freshness
          pnpm audit:stories

      - name: Sync Supabase
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            pnpm sync:supabase
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            pnpm sync:supabase:direct
          else
            echo "No Supabase credential configured" >&2
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Commit refreshed data
        run: |
          git config user.name "stockmonk-data-bot"
          git config user.email "data-bot@stockmonk.app"
          git add data public/data content
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily market data refresh"
            git push
          fi
