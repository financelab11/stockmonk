name: Daily market data refresh

on:
  schedule:
    # GitHub cron is UTC. Run at 07:00 and 08:00 UTC so one of the two
    # attempts is 03:00 in America/New_York in both EDT and EST. The guard
    # job below skips the duplicate.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: Queue every story for a rewrite
        type: boolean
        default: false
      tickers:
        description: Comma-separated tickers for a manual rewrite
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-market-data-refresh
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - name: Check 3am US Eastern
        id: clock
        run: |
          hour=$(TZ=America/New_York date +%H)
          echo "America/New_York hour: $hour"
          if [ "$hour" = "03" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: guard
    if: needs.guard.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_ALL: ${{ inputs.force_all }}
      TICKERS: ${{ inputs.tickers }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh US coverage
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 30))
            done
            return 1
          }
          # SEC statements are versioned and refreshed by the weekly bulk job.
          # The daily run rebuilds prices, consensus and scores from them.
          retry pnpm ingest:fundamentals
          retry pnpm ingest:consensus
          retry pnpm ingest:segments
          retry pnpm ingest:benchmark
          retry pnpm ingest:earnings
          pnpm build:data
          pnpm build:scores
          pnpm build:kpis
          pnpm build:screener
          pnpm build:portfolios
          pnpm build:portfolio-logos
          pnpm ingest:logos
          pnpm build:runtime
          pnpm build:seo

      - name: Detect material story events
        run: |
          ARGS=""
          if [ "$FORCE_ALL" = "true" ]; then ARGS="$ARGS --force-all"; fi
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --ticker=$TICKERS"; fi
          pnpm detect:events $ARGS

      - name: Commit refreshed data
        run: |
          git config user.name "stockmonk-data-bot"
          git config user.email "data-bot@stockmonk.app"
          git add data public/data public/logos public/portfolio-logos
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily market data refresh"
            git push
          fi

      - name: Rewrite material stories
        env:
          REWRITE_PROVIDER: ${{ vars.REWRITE_PROVIDER }}
          REWRITE_API_KEY: ${{ secrets.REWRITE_API_KEY }}
          REWRITE_MODEL: ${{ vars.REWRITE_MODEL }}
          REWRITE_API_URL: ${{ vars.REWRITE_API_URL }}
        run: |
          ARGS=""
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --ticker=$TICKERS"; fi
          if [ "$FORCE_ALL" = "true" ]; then ARGS="$ARGS --force-all"; fi
          pnpm stories:rewrite $ARGS

      - name: Rebuild the story freshness manifest
        run: |
          ARGS=""
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --ticker=$TICKERS"; fi
          pnpm detect:events $ARGS

      - name: Check freshness
        run: |
          pnpm audit:freshness --strict
          pnpm audit:stories --strict
          pnpm audit:research
          pnpm audit:numbers

      - name: Validate content and types
        run: |
          pnpm validate:content
          pnpm validate:portfolios
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Sync Supabase
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            pnpm sync:supabase
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            pnpm sync:supabase:direct
          else
            echo "No Supabase credential configured" >&2
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Sync normalized research tables
        run: pnpm sync:v2
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Sync portfolio tables
        run: pnpm sync:portfolios
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}

      - name: Commit refreshed narratives
        run: |
          git add content data public/data public/logos
          if git diff --cached --quiet; then
            echo "No narrative changes to commit."
          else
            git commit -m "chore: refresh research narratives"
            git push
          fi

      - name: Verify production data health
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 30 --retry-all-errors \
            https://stockmonk.vercel.app/api/health/data

      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily data refresh failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled data refresh did not complete.",
              "",
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
              `Time: ${new Date().toISOString()}`,
              "",
              "Check the failed step and the freshness manifest before re-running.",
              "",
              "If the failure is a rewrite-pending queue, configure REWRITE_PROVIDER and REWRITE_API_KEY, or rewrite the queued tickers manually.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
