name: Earnings tracker refresh

on:
  schedule:
    # After the Indian close (15:30 IST) and Yahoo's end-of-day settle.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earnings-tracker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore crawl caches
        uses: actions/cache@v4
        with:
          path: |
            data/india/.screener-cache
            data/india/.price-cache
          key: earnings-cache-${{ github.run_id }}
          restore-keys: |
            earnings-cache-

      - name: Refresh 1Y returns from Yahoo Finance
        run: pnpm refresh:earnings-prices
        env:
          PRICE_DELAY_MS: "150"

      - name: Refresh the Screener universe
        run: pnpm ingest:screener
        env:
          SCREENER_MIN_MCAP: "1000"
          SCREENER_DELAY_MS: "1000"
          # Screen rows refresh daily; company pages every seventh day.
          SCREENER_COMPANY_TTL_DAYS: "7"

      - name: Rebuild the earnings tracker
        run: pnpm build:earnings

      - name: Commit refreshed earnings data
        run: |
          git config user.name "stockmonk-data-bot"
          git config user.email "data-bot@stockmonk.app"
          git add data/india/screener-earnings.json data/india/earnings-prices.json data/india/earnings-tracker.json
          if git diff --cached --quiet; then
            echo "No earnings changes to commit."
          else
            git commit -m "chore: daily earnings tracker refresh"
            git push
          fi
