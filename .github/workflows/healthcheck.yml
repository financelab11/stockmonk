name: Production data health check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the production data contract
        id: health
        run: |
          status=$(curl --silent --show-error --output /tmp/stockmonk-health.json --write-out "%{http_code}" https://stockmonk.vercel.app/api/health/data || true)
          cat /tmp/stockmonk-health.json || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "200"

      - name: Open or update the health issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production data health check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The production data-health endpoint did not return 200.",
              "",
              `Run: ${runUrl}`,
              `Time: ${new Date().toISOString()}`,
              "",
              "Check /api/health/data and the daily refresh workflow.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
